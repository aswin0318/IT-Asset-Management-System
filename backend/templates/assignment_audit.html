<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #333;
            padding: 6px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h1>Asset Assignment Audit Report</h1>

<table>
    <thead>
        <tr>
            <th>Asset</th>
            <th>Serial</th>
            <th>Employee</th>
            <th>Assigned Date</th>
            <th>Returned Date</th>
        </tr>
    </thead>
    <tbody>
        {% for row in rows %}
        <tr>
            <td>{{ row.asset_name }}</td>
            <td>{{ row.serial_number }}</td>
            <td>{{ row.employee_name }}</td>
            <td>{{ row.assigned_date }}</td>
            <td>{{ row.returned_date or "Active" }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
